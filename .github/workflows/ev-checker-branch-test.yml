name: EV checker branch test

on:
  push:
    branches: [ev-rate-checker-fix-v123]
    paths:
      - ".github/workflows/ev-checker-branch-test.yml"
      - "scripts/check_ev_charge_price.py"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile checker
        run: python -m py_compile scripts/check_ev_charge_price.py
      - name: Read official EV rate
        run: python scripts/check_ev_charge_price.py --propose
      - name: Verify no unexpected rate proposal
        run: git diff --exit-code -- data/ev_charge_price_history.json
