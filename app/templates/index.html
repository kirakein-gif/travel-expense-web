<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>여비정산 자동화</title><link rel="stylesheet" href="/static/app.css"></head><body><main class="shell"><section class="hero"><div><p class="eyebrow">TRAVEL EXPENSE AUTOMATION</p><h1>여비정산 자동화</h1><p class="sub">출장 정보 한 번 입력으로 거리·적용단가·자동차운임·증빙을 계산합니다.</p></div><div class="badge">v0.1 MVP</div></section><section class="grid"><form id="travelForm" class="card"><h2>출장 정보</h2><label>출장일<input id="travel_date" type="date" required></label><label>출발지<input id="origin" type="text" placeholder="예: 천안버들유치원" required></label><label>출장지<input id="destination" type="text" placeholder="예: 충청남도교육청" required></label><label>차량 종류<select id="vehicle_type"><option value="gasoline">휘발유</option><option value="diesel">경유</option><option value="lpg">LPG</option><option value="electric">전기차</option><option value="hydrogen">수소차</option></select></label><label>연비 / 전비<input id="efficiency" type="number" step="0.1" min="0.1" value="11.5" required><span class="help">일반차 km/L · 전기차 km/kWh · 수소차 km/kg</span></label><label class="check"><input id="round_trip" type="checkbox" checked>왕복으로 계산</label><button type="submit">자동 계산</button></form><section class="card result"><h2>산출 결과</h2><div id="status" class="status">출장 정보를 입력하고 자동 계산을 눌러주세요.</div><dl><div><dt>총 운행거리</dt><dd id="distance">-</dd></div><div><dt>적용단가</dt><dd id="price">-</dd></div><div><dt>자동차운임</dt><dd id="amount">-</dd></div><div><dt>가격출처</dt><dd id="source">-</dd></div><div><dt>증빙상태</dt><dd id="evidence">-</dd></div></dl></section></section></main><script>const form=document.getElementById('travelForm');const fmt=n=>n==null?'-':Number(n).toLocaleString('ko-KR');form.addEventListener('submit',async e=>{e.preventDefault();document.getElementById('status').textContent='계산 중...';const payload={travel_date:document.getElementById('travel_date').value,origin:document.getElementById('origin').value,destination:document.getElementById('destination').value,vehicle_type:document.getElementById('vehicle_type').value,efficiency:Number(document.getElementById('efficiency').value),round_trip:document.getElementById('round_trip').checked};try{const r=await fetch('/api/estimate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await r.json();if(!r.ok)throw new Error(data.detail||'요청 실패');document.getElementById('distance').textContent=fmt(data.distance_km)+' km';document.getElementById('price').textContent=data.energy_price==null?'연결 예정':fmt(data.energy_price)+' 원';document.getElementById('amount').textContent=data.estimated_transport_cost==null?'단가 연결 후 계산':fmt(data.estimated_transport_cost)+' 원';document.getElementById('source').textContent=data.price_source||'-';document.getElementById('evidence').textContent=data.evidence_status;document.getElementById('status').textContent='거리 계산 완료'}catch(err){document.getElementById('status').textContent=err.message}});</script></body></html>
