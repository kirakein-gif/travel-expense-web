<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>여비정산 자동화</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<main class="shell">
  <section class="hero">
    <div>
      <p class="eyebrow">TRAVEL EXPENSE AUTOMATION</p>
      <h1>여비정산 자동화</h1>
      <p class="sub">출장 정보 한 번 입력으로 거리·적용단가·자동차운임·증빙을 계산합니다.</p>
    </div>
    <div class="badge">v0.3 PROGRESSIVE</div>
  </section>

  <section class="grid">
    <form id="travelForm" class="card">
      <h2>출장 정보</h2>
      <label>출장일<input id="travel_date" type="date" required></label>
      <label>출발지<input id="origin" type="text" placeholder="예: 천안버들유치원" required></label>
      <label>출장지<input id="destination" type="text" placeholder="예: 충청남도교육청 또는 내포" required></label>
      <label>차량 종류
        <select id="vehicle_type">
          <option value="gasoline">휘발유</option>
          <option value="diesel">경유</option>
          <option value="lpg">LPG</option>
          <option value="electric">전기차</option>
          <option value="hydrogen">수소차</option>
        </select>
      </label>
      <label>연비 / 전비
        <input id="efficiency" type="number" step="0.1" min="0.1" value="11.5" required>
        <span class="help">일반차 km/L · 전기차 km/kWh · 수소차 km/kg</span>
      </label>
      <label class="check"><input id="round_trip" type="checkbox" checked>왕복으로 계산</label>
      <button id="calculateButton" type="submit">자동 계산</button>
      <button id="pdfButton" type="button" disabled style="margin-top:10px;background:#475569">PDF 산출내역</button>
    </form>

    <section class="card result">
      <h2>산출 결과</h2>
      <div id="status" class="status">출장 정보를 입력하고 자동 계산을 눌러주세요.</div>
      <dl>
        <div><dt>총 운행거리</dt><dd id="distance">-</dd></div>
        <div><dt>거리 기준</dt><dd id="distance_source">-</dd></div>
        <div><dt>기준 목적지</dt><dd id="destination_code">-</dd></div>
        <div><dt>적용단가</dt><dd id="price">-</dd></div>
        <div><dt>자동차운임</dt><dd id="amount">-</dd></div>
        <div><dt>가격출처</dt><dd id="source">-</dd></div>
        <div><dt>증빙상태</dt><dd id="evidence">-</dd></div>
      </dl>
    </section>
  </section>
</main>

<script>
const form = document.getElementById("travelForm");
const calculateButton = document.getElementById("calculateButton");
const pdfButton = document.getElementById("pdfButton");
const fmt = n => n == null ? "-" : Number(n).toLocaleString("ko-KR");
let lastPayload = null;

function payloadFromForm() {
  return {
    travel_date: document.getElementById("travel_date").value,
    origin: document.getElementById("origin").value,
    destination: document.getElementById("destination").value,
    vehicle_type: document.getElementById("vehicle_type").value,
    efficiency: Number(document.getElementById("efficiency").value),
    round_trip: document.getElementById("round_trip").checked
  };
}

function resetResult() {
  document.getElementById("distance").textContent = "-";
  document.getElementById("distance_source").textContent = "-";
  document.getElementById("destination_code").textContent = "-";
  document.getElementById("price").textContent = "-";
  document.getElementById("amount").textContent = "-";
  document.getElementById("source").textContent = "-";
  document.getElementById("evidence").textContent = "-";
}

form.addEventListener("submit", async e => {
  e.preventDefault();
  resetResult();
  calculateButton.disabled = true;
  pdfButton.disabled = true;
  lastPayload = null;
  const payload = payloadFromForm();

  try {
    document.getElementById("status").textContent = "1/2 주소 확인 및 거리 계산 중...";

    const distanceResponse = await fetch("/api/distance", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(payload)
    });
    const distanceData = await distanceResponse.json();
    if (!distanceResponse.ok) throw new Error(distanceData.detail || "거리 계산 실패");

    document.getElementById("distance").textContent = fmt(distanceData.distance_km) + " km";
    document.getElementById("distance_source").textContent = distanceData.distance_source + (distanceData.distance_cache_hit ? " · 캐시" : "");
    document.getElementById("destination_code").textContent = distanceData.destination_support_office || distanceData.destination_code || distanceData.sigungu || "-";

    document.getElementById("status").textContent = "거리 계산 완료 · 2/2 유가 조회 중...";
    document.getElementById("price").textContent = "조회 중...";
    document.getElementById("amount").textContent = "단가 대기 중...";
    document.getElementById("source").textContent = "오피넷 조회 중...";
    document.getElementById("evidence").textContent = "준비 중...";

    const pricePayload = {
      travel_date: payload.travel_date,
      vehicle_type: payload.vehicle_type,
      efficiency: payload.efficiency,
      distance_km: distanceData.distance_km,
      province: distanceData.province,
      sigungu: distanceData.sigungu
    };

    const priceResponse = await fetch("/api/price", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(pricePayload)
    });
    const priceData = await priceResponse.json();
    if (!priceResponse.ok) {
      throw new Error("유가 조회 실패: " + (priceData.detail || "요청 실패"));
    }

    document.getElementById("price").textContent = priceData.energy_price == null ? "연결 예정" : fmt(priceData.energy_price) + " 원";
    document.getElementById("amount").textContent = priceData.estimated_transport_cost == null ? "단가 연결 후 계산" : fmt(priceData.estimated_transport_cost) + " 원";
    document.getElementById("source").textContent = (priceData.price_source || "-") + (priceData.price_cache_hit ? " · 캐시" : "");
    document.getElementById("evidence").textContent = priceData.evidence_status;
    document.getElementById("status").textContent = "계산 완료";

    lastPayload = payload;
    pdfButton.disabled = false;
  } catch (err) {
    const distanceDone = document.getElementById("distance").textContent !== "-";
    document.getElementById("status").textContent = distanceDone
      ? "거리 계산 완료 · " + err.message
      : err.message;
    if (distanceDone && document.getElementById("price").textContent === "조회 중...") {
      document.getElementById("price").textContent = "조회 실패";
      document.getElementById("amount").textContent = "-";
      document.getElementById("source").textContent = "-";
      document.getElementById("evidence").textContent = "failed";
    }
  } finally {
    calculateButton.disabled = false;
  }
});

pdfButton.addEventListener("click", async () => {
  if (!lastPayload) return;
  pdfButton.disabled = true;
  const oldText = pdfButton.textContent;
  pdfButton.textContent = "PDF 생성 중...";

  try {
    const r = await fetch("/api/report.pdf", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(lastPayload)
    });
    if (!r.ok) {
      const data = await r.json();
      throw new Error(data.detail || "PDF 생성 실패");
    }

    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `여비산출내역_${lastPayload.travel_date}.pdf`;
    a.click();
    URL.revokeObjectURL(url);
  } catch (err) {
    document.getElementById("status").textContent = err.message;
  } finally {
    pdfButton.textContent = oldText;
    pdfButton.disabled = false;
  }
});
</script>
</body>
</html>
